name: Release

# P6：打 v* 标签 → Windows runner 构建（后端 PyInstaller + Tauri NSIS 安装包）
# → 生成 Release 草稿并附加安装包。产物路径：
#   src-tauri/target/release/bundle/nsis/*.exe（Tauri 壳）
#   backend/dist/backend-server/（内嵌于安装包 resources，无需单独发布）

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer & draft release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build backend (PyInstaller onedir)
        working-directory: backend
        run: python -m PyInstaller packaging/backend.spec --noconfirm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # tauri build 会自动执行 beforeBuildCommand（npm run build）并打包
      # resources（backend-server onedir 产物）→ NSIS 安装包。
      # 必须走 npm run tauri（package.json script = cd .. && tauri）：
      # Tauri CLI 不向上查找 src-tauri，直接 npx 会报 app_paths panic。
      - name: Build Tauri app (frontend + Rust + NSIS)
        working-directory: frontend
        run: npm run tauri -- build --bundles nsis

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          git log -30 --pretty=format:'- %s' --no-merges | Out-File -Encoding utf8 release-notes.txt
          Write-Output "notes-file=release-notes.txt" >> $env:GITHUB_OUTPUT

      - name: Draft release with installer
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.notes-file }}
          files: src-tauri/target/release/bundle/nsis/*.exe
